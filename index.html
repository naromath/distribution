<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학교 정보 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/distribution/assets/index-CcXsOKD1.js"></script>
    <link rel="stylesheet" crossorigin href="/distribution/assets/index-BTZeX1Ku.css">
  </head>
  <body>
    <div id="app">
      <!-- 로그인 / 회원가입 컨테이너 -->
      <div id="auth-container" class="app-container auth-container" style="display: none;">
        <div class="header" style="text-align: center;">
          <h1 id="auth-title">로그인</h1>
          <p id="auth-desc">학교 정보 퀴즈에 접속하세요.</p>
          <div class="auth-cheer-text">즐거운 퀴즈 시간!</div>
        </div>
        <div class="card">
          <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px;">아이디</label>
            <input type="text" id="auth-id" class="text-input" placeholder="아이디">
          </div>
          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px;">비밀번호</label>
            <input type="password" id="auth-pw" class="text-input" placeholder="비밀번호">
          </div>
          <button class="btn-primary" id="auth-action-btn" style="width: 100%; margin-bottom: 10px;">로그인</button>
          <div style="text-align: center; font-size: 13px; color: var(--color-text-secondary);">
            <span id="auth-toggle-text">계정이 없으신가요?</span> <span id="auth-toggle-btn" style="color: var(--color-text-primary); cursor: pointer; font-weight: 500; text-decoration: underline;">회원가입</span>
          </div>
        </div>
      </div>

      <div id="main-app-container" class="app-container" style="display: none;">
        <div class="header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
          <div>
            <h1 style="color: #60a5fa;">학교 정보 퀴즈</h1>
            <p>우리 학교에 대해 알아보아요!</p>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
            <span id="user-greeting" style="font-size: 13px; color: var(--color-text-secondary);"></span>
            <button class="btn-outline" id="logout-btn" style="font-size: 12px; padding: 6px 12px; border-color: #334155;">로그아웃</button>
          </div>
        </div>

        <div id="dashboard" class="tab active" style="display: block;">
          <div class="card" style="text-align: center; padding: 2rem 1rem;">
            <div style="font-size: 60px; margin-bottom: 10px;">🏫</div>
            <div class="card-title" style="font-size: 20px;">학교 정보 퀴즈</div>
            <div class="card-sub" style="margin-bottom: 24px; font-size: 14px;">재미있는 퀴즈를 풀며 우리 학교를 알아보세요.</div>
            
            <div style="margin-bottom: 20px; text-align: left; background: var(--color-background-secondary, #111f38); padding: 15px; border-radius: 8px;">
              <div style="font-size: 14px; color: var(--color-text-secondary, #94a3b8); margin-bottom: 10px;">스피드 조절</div>
              <div style="display: flex; gap: 15px; justify-content: center;">
                <label style="font-size: 14px; cursor: pointer;"><input type="radio" name="quiz-speed" value="5000"> 느리게 (5초)</label>
                <label style="font-size: 14px; cursor: pointer;"><input type="radio" name="quiz-speed" value="3000" checked> 보통 (3초)</label>
                <label style="font-size: 14px; cursor: pointer;"><input type="radio" name="quiz-speed" value="2000"> 빠르게 (2초)</label>
              </div>
            </div>

            <div style="display: flex; gap: 10px;">
              <button class="btn-primary" id="start-quiz-btn" style="flex: 1; font-size: 16px; padding: 14px; background-color: #3b82f6; border-color: #2563eb; color: #fff;">퀴즈 시작하기</button>
              <button class="btn-outline" id="view-ranking-btn" style="font-size: 16px; padding: 14px; background-color: #1e293b; border-color: #475569; color: #fbbf24;">🏆 랭킹 보기</button>
            </div>
          </div>
        </div>

        <div id="ranking-view" class="tab" style="display: none;">
          <div class="card" style="padding: 1.5rem 1.2rem; background-color: #0f172a; border-radius: 10px;">
            <div style="text-align: center; margin-bottom: 20px;">
              <div style="font-size: 40px;">🏆</div>
              <h2 style="color: #fbbf24; font-size: 20px; font-weight: 700; margin-top: 10px;">글로벌 명예의 전당</h2>
              <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">전체 유저 중 Top 10의 최고 기록입니다.</p>
            </div>
            
            <div id="ranking-list" style="display: flex; flex-direction: column; gap: 8px;">
              <div style="text-align: center; color: #94a3b8; padding: 20px;">로딩 중...</div>
            </div>

            <div style="text-align: center; margin-top: 24px;">
              <button class="btn-outline" id="ranking-back-btn" style="font-size: 14px; padding: 10px 20px; width: 100%;">대시보드로 돌아가기</button>
            </div>
          </div>
        </div>

        <div id="quiz-view" class="tab" style="display: none;">
          <div class="quiz-box" style="padding: 1.5rem 1.2rem; background-color: #0f172a; border-radius: 10px; position: relative; overflow: hidden;">
            
            <div id="timer-bar-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1);">
              <div id="timer-bar" style="width: 100%; height: 100%; background: #3b82f6; transition: width 0.1s linear;"></div>
            </div>

            <div class="quiz-q-num" style="font-size: 14px; color: #94a3b8; margin-top: 10px; margin-bottom: 12px; display: flex; justify-content: space-between;">
              <span id="quiz-progress">문제 1 / 50</span>
              <span id="quiz-score-text" style="color: #fbbf24; font-weight: 700;">점수: 0</span>
              <span id="quiz-timer-text" style="color: #60a5fa; font-weight: 700;">3.0초</span>
            </div>
            
            <div class="quiz-q" id="quiz-question" style="font-size: 20px; font-weight: 700; color: #ffffff; line-height: 1.4; word-break: keep-all; margin-bottom: 24px;"></div>
            
            <div id="quiz-options" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
              <!-- 옵션 버튼들이 여기에 동적으로 렌더링됩니다 -->
            </div>

            <div id="quiz-answer-area" style="display: none; margin-top: 10px;">
              <div style="font-size: 14px; color: #94a3b8; margin-bottom: 8px;">정답:</div>
              <div id="quiz-answer" style="font-size: 22px; font-weight: 700; color: #10b981; background: rgba(16,185,129,0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(16,185,129,0.3); text-align: center; word-break: keep-all;"></div>
            </div>

          </div>
          <div style="text-align: center; margin-top: 24px;">
            <button class="btn-outline" id="back-to-home-btn" style="font-size: 14px; padding: 10px 20px;">대시보드로 돌아가기</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
